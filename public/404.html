<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found | MotionNodeEdits</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #050507;
        color: #FFFFFF;
        font-family: 'Plus Jakarta Sans', sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        text-align: center;
      }
      h1 {
        font-size: 3rem;
        margin-bottom: 1rem;
      }
      p {
        color: #8E8F94;
        margin-bottom: 2rem;

        color: #000000;
        background-color: #FFFFFF;
        padding: 12px 24px;
        text-decoration: none;
        border-radius: 4px;
        font-weight: 500;
        transition: opacity 0.3s;
      }
      a:hover {
        opacity: 0.8;
      }
